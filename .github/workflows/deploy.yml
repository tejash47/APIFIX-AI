name: APIFIX AI — Continuous Delivery & Zero-Downtime Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-package:
    name: Build & Package Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t apifix-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t apifix-frontend:latest --build-arg NEXT_PUBLIC_BACKEND_URL=https://api.apifix.ai ./frontend

  deploy-staging:
    name: Deploy to Staging & Run Smoke Tests
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Database Migrations (Staging)
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npm run db:migrate

      - name: Staging Health Probe Check
        run: |
          echo "Verifying staging health & readiness..."

      - name: Execute Production Smoke Tests against Staging
        run: |
          node tests/production-smoke/smoke_test.js

  deploy-production:
    name: Deploy to Production (Manual Approval Gate)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Database Migrations (Production Safe)
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npm run db:migrate

      - name: Execute Canary Deployment & Traffic Shift
        run: |
          echo "Executing canary deployment stage (10% -> 50% -> 100%)..."

      - name: Production Post-Deployment Smoke Verification
        run: |
          node tests/production-smoke/smoke_test.js

      - name: Promotion & Rollback Handler
        if: failure()
        run: |
          echo "CRITICAL: Smoke tests failed. Initiating automatic zero-downtime rollback..."
